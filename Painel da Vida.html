<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel da Vida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EFF0;--sf:#fff;--ink:#14263A;--mut:#5A6B79;--ln:#D3DCE0;--pri:#0F6B5C;--on:#fff;--sun:#F2B33D;--red:#C93F26;--tint:#DCEBE6;--h:'Bricolage Grotesque',system-ui,sans-serif;--b:'Instrument Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1923;--sf:#16252F;--ink:#E7EEF2;--mut:#9AABB8;--ln:#26394A;--pri:#45C3AA;--on:#06261F;--red:#FF7B5E;--tint:#1A3A39}}
:root[data-theme="dark"]{--bg:#0E1923;--sf:#16252F;--ink:#E7EEF2;--mut:#9AABB8;--ln:#26394A;--pri:#45C3AA;--on:#06261F;--red:#FF7B5E;--tint:#1A3A39}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--b)}
h1,h2,h3{font-family:var(--h);margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:.65rem 1.1rem;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}
.btn.sm{padding:.3rem .7rem;min-height:36px;font-size:.9rem}
.mut,.sub{color:var(--mut)}.sub{font-size:.88rem}
.logo{font:800 1.25rem var(--h);display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.logo::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--tint)}
.wrap{min-height:100vh}
.side{display:none}
main{padding:1.1rem 1rem 6.5rem;max-width:1040px;margin:0 auto}
.bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bot a{flex:1;text-align:center;padding:.75rem 0;font-size:.82rem;color:var(--mut);text-decoration:none;font-weight:500}
.bot a.on{color:var(--pri);font-weight:600;box-shadow:inset 0 3px var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center}
.top .logo{margin:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--tint);color:var(--pri);display:grid;place-items:center;font-weight:700;text-decoration:none}
@media(min-width:900px){.wrap{display:grid;grid-template-columns:230px 1fr}
.side{display:flex;flex-direction:column;gap:.2rem;padding:1.5rem 1rem;border-right:1px solid var(--ln);background:var(--sf);position:sticky;top:0;height:100vh}
.side a{padding:.6rem .8rem;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.side a.on{background:var(--tint);color:var(--pri)}
.bot,.top{display:none}main{padding:2rem 2.5rem;width:100%}}
.hi{font-size:clamp(2rem,7vw,3rem);font-weight:800;line-height:1.05;margin-top:1.2rem}
.big{font:800 clamp(1.4rem,4.5vw,2rem)/1.15 var(--h);margin:1.2rem 0 .2rem}
.qa{background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:.9rem 1rem;margin:1.2rem 0}
.qa:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px var(--tint)}
.qa input{width:100%;border:0;background:transparent;font:600 1.1rem var(--h);outline:0;padding:.3rem 0}
.qa .sub{margin:.2rem 0 0}
.qr{display:flex;gap:.6rem;align-items:center}
.pv{border-top:1px solid var(--ln);margin-top:.8rem;padding-top:.7rem}
.pvr{padding:.3rem 0}
.grid{display:grid;gap:1rem}.col{display:grid;gap:1rem;align-content:start}
@media(min-width:900px){.grid{grid-template-columns:1.3fr 1fr}}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:1rem 1.1rem}
.pn+.pn{margin-top:1rem}.col .pn+.pn{margin-top:0}
.pn h3{font-size:1.05rem;margin-bottom:.4rem}
.pn>a{display:inline-block;margin-top:.5rem;color:var(--pri);font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:.8rem 0 1rem}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;padding:.65rem 0}
.row+.row{border-top:1px solid var(--ln)}
.tt{flex:1 1 55%;min-width:0;overflow-wrap:anywhere}.tt b{font-weight:600}
.done .tt b{text-decoration:line-through;color:var(--mut)}
.ac{display:flex;gap:.3rem;margin-left:auto}
.ck{width:32px;height:32px;border-radius:9px;border:2px solid var(--mut);background:transparent;padding:0;font-weight:800;flex:none;transition:background .15s}
.ck.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
.tag{font-size:.74rem;padding:.05rem .55rem;border-radius:99px;border:1px solid var(--ln);margin-right:.3rem}
.tag.alta{color:var(--red);border-color:var(--red)}.tag.média{border-color:var(--sun)}
.late,.err{color:var(--red)}.err{min-height:1.3em;font-size:.9rem;margin:.4rem 0}
.tl{border-left:3px solid var(--sun);padding:.1rem 0 .1rem .8rem;margin:.6rem 0}
.tl b{font-family:var(--h)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.chip{border:1.5px solid var(--ln);background:transparent;border-radius:99px;padding:.3rem .85rem;min-height:36px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips select{margin-left:auto;width:auto}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.sums div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:.7rem}
.sums b{display:block;font:700 1.05rem var(--h)}
.cat{display:grid;grid-template-columns:110px 1fr auto;gap:.6rem;align-items:center;padding:.3rem 0;font-size:.92rem}
.bw{background:var(--tint);border-radius:5px}.bar{height:10px;border-radius:5px;background:var(--pri)}
label{display:block;font-size:.9rem;font-weight:600;margin-top:.8rem}
label input,label select{margin-top:.25rem;font-weight:400}
input,select{width:100%;padding:.65rem .75rem;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg)}
dialog{border:0;border-radius:16px;padding:1.2rem;width:min(440px,92vw);background:var(--sf);color:var(--ink)}
dialog::backdrop{background:#0009}
.ac2{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:99px;z-index:20;display:flex;gap:.6rem;align-items:center}
.toast[hidden]{display:none}.toast button{background:none;border:0;color:var(--sun);font-weight:700;text-decoration:underline}
.auth{min-height:100vh;display:grid;place-items:center;padding:1.2rem}
.card{width:min(420px,100%)}
.card>p{font-size:1.15rem;margin:0}
.plan{background:var(--sf);border:1.5px solid var(--pri);border-radius:16px;padding:1.2rem;margin:1.2rem 0}
.plan .price{font:800 2.4rem/1 var(--h)}.plan ul{padding-left:1.1rem;margin:.9rem 0 1.1rem}
.pay{display:grid;gap:.6rem}
.code{background:var(--bg);border:1px dashed var(--ln);border-radius:10px;padding:.6rem;font-size:.8rem;overflow-wrap:anywhere;margin:.6rem 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" class="toast" hidden role="status"></div>
<script>
const mem={},st={g(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const $=(s,r=document)=>r.querySelector(s),J=(s,f)=>{try{return JSON.parse(s)??f}catch(e){return f}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)},TD=()=>addD(0);
const fdt=s=>!s?'':s===TD()?'hoje':s===addD(1)?'amanhã':s.split('-').reverse().slice(0,2).join('/');
const R=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Math.random().toString(36).slice(2,10),cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pl=(n,a,b)=>n+' '+(n===1?a:b),pad=n=>String(n).padStart(2,'0');
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');

let users=J(st.g('pv:u'),[]),me=st.g('pv:s')||null,D=null,view='dash',filt='todas',sortBy='prazo',mode='login',pend=[],last=null,tmr;
const saveU=()=>st.s('pv:u',JSON.stringify(users)),user=()=>users.find(u=>u.id===me);
const load=()=>{D=J(st.g('pv:d:'+me),{tasks:[],rem:[],agenda:[],fin:[]})},save=()=>st.s('pv:d:'+me,JSON.stringify(D));
const byDue=(a,b)=>(a.due||'9')<(b.due||'9')?-1:1,byDT=(a,b)=>(a.date+(a.time||a.start||''))<(b.date+(b.time||b.start||''))?-1:1;

const DAY=864e5,demoU=u=>u.email==='demo@painel.app',active=u=>!!u&&(demoU(u)||!!(u.sub&&u.sub.until>Date.now())),dl2=t=>new Date(t).toLocaleDateString('pt-BR');
let mySid=null;
const subSec=u=>{const s=u.sub;return `<section class="pn"><h3>Assinatura</h3>${demoU(u)?'<p class="sub">Conta de demonstração, sem cobrança.</p>':s?`<p>Plano mensal de ${R(12.99)}, pago com ${s.method==='pix'?'Pix':'cartão de crédito'}.</p><p class="sub">${s.renew?'Renova em ':'Acesso até '}${dl2(s.until)}${s.renew?'':', sem renovação'}.</p><button class="btn ghost sm" data-a="renew">${s.renew?'Cancelar renovação':'Reativar renovação'}</button>`:''}</section>`};
const vPay=()=>`<div class="auth"><div class="card"><div class="logo">Painel da Vida</div><p>Olá, ${esc(user().name.split(' ')[0])}. Falta só ativar seu acesso.</p><div class="plan"><div class="price">${R(12.99)}<span class="sub" style="font:400 1rem var(--b)"> por mês</span></div><ul><li>Tarefas, lembretes, agenda e finanças</li><li>Uma conta, uma pessoa, um dispositivo por vez</li><li>Cancele quando quiser, sem multa</li></ul><div class="pay"><button class="btn" data-a="pay" data-v="pix">Assinar com Pix</button><button class="btn ghost" data-a="pay" data-v="card">Assinar com cartão de crédito</button></div></div><p class="sub">Modo demonstração: o pagamento é simulado e nenhuma cobrança real acontece.</p><button class="btn ghost sm" data-a="logout">Sair da conta</button></div></div>`;
function openPay(v){const dl=$('#dlg');dl.innerHTML=`<h2>${v==='pix'?'Pagar com Pix':'Pagar com cartão'}</h2>${v==='pix'?'<p class="sub">No app do seu banco, escolha Pix copia e cola e cole o código abaixo.</p><div class="code">00020126DEMO-PAINEL-DA-VIDA-12.99</div>':'<p class="sub">Você seria levado ao checkout seguro do provedor de pagamento. Os dados do cartão nunca passam por este site.</p>'}<div class="ac2"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn" data-a="paid" data-v="${v}">Simular pagamento aprovado</button></div>`;dl.showModal()}
const CAT=['Alimentação','Transporte','Contas','Lazer','Saúde','Salário','Outros'];
const F={
 tasks:{n:'tarefa',g:'Nova',f:[['title','Título','text',1],['description','Detalhes','text'],['priority','Prioridade',['baixa','média','alta']],['due','Prazo','date']],d:{priority:'média',status:'pendente'}},
 rem:{n:'lembrete',g:'Novo',f:[['title','O que lembrar','text',1],['date','Data','date',1],['time','Horário','time']],d:{status:'pendente',time:'09:00'}},
 agenda:{n:'compromisso',g:'Novo',f:[['title','Compromisso','text',1],['date','Data','date',1],['start','Início','time'],['end','Fim','time'],['location','Local','text']],d:{}},
 fin:{n:'transação',g:'Nova',f:[['type','Tipo',['despesa','receita']],['description','Descrição','text',1],['amount','Valor (R$)','number',1],['category','Categoria',CAT],['date','Data','date',1]],d:{type:'despesa',category:'Outros'}}
};
function seed(){const mk=(o)=>({id:uid(),created_at:Date.now(),updated_at:Date.now(),...o}),n=new Date(),m1=iso(new Date(n.getFullYear(),n.getMonth(),1)),t=TD();
 return{tasks:[mk({title:'Comprar mercado',priority:'média',status:'pendente',due:t}),mk({title:'Estudar 1 hora',priority:'alta',status:'pendente',due:t}),mk({title:'Pagar conta',priority:'baixa',status:'pendente',due:addD(2)}),mk({title:'Organizar a semana',priority:'baixa',status:'concluída',due:''})],
 rem:[mk({title:'Conta de luz vence amanhã',date:addD(1),time:'09:00',status:'pendente'}),mk({title:'Renovar documento',date:addD(6),time:'10:00',status:'pendente'})],
 agenda:[mk({title:'Médico',date:t,start:'14:00',end:'15:00',location:'Clínica Central'}),mk({title:'Dentista',date:addD(3),start:'09:30',end:'10:30',location:''})],
 fin:[mk({type:'receita',description:'Salário',amount:3000,category:'Salário',date:m1}),mk({type:'despesa',description:'Feira do mês',amount:455,category:'Alimentação',date:m1}),mk({type:'despesa',description:'Almoço',amount:45,category:'Alimentação',date:t}),mk({type:'despesa',description:'Transporte',amount:300,category:'Transporte',date:m1}),mk({type:'despesa',description:'Contas da casa',amount:600,category:'Contas',date:m1})]}}

/* ---------- interpretador de frases (regras simples, sem IA) ---------- */
const WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const catOf=d=>/mercado|comida|lanche|almo|jantar|restaurante|padaria|feira/.test(d)?'Alimentação':/ônibus|onibus|uber|gasolina|passagem/.test(d)?'Transporte':/luz|água|agua|internet|aluguel|conta/.test(d)?'Contas':/cinema|bar |festa|jogo/.test(d)?'Lazer':/farmácia|farmacia|remédio|dentista/.test(d)?'Saúde':'Outros';
const cln=(t,ap)=>{t=t.replace(/\b(preciso de|preciso|precisamos|tenho que|tenho de|tenho|vou|quero|devo)\b/g,' ').replace(/\s+/g,' ').trim().replace(/^(e|então)\s+/,'');if(ap)t=t.replace(/^ir\s+(ao|à|a|no|na)\s+/,'').replace(/^(ao|à)\s+/,'');return cap(t.replace(/^(de|que)\s+/,'').replace(/[.!?]+$/,'').trim())};
function parse(txt){
 let s=' '+txt.toLowerCase().replace(/\s+/g,' ').trim()+' ',date=TD(),out=[];
 if(/depois de amanhã/.test(s)){date=addD(2);s=s.replace(/depois de amanhã/g,' ')}
 else if(/amanhã/.test(s)){date=addD(1);s=s.replace(/amanhã/g,' ')}
 else if(/\bhoje\b/.test(s))s=s.replace(/\bhoje\b/g,' ');
 else{const w=WD.findIndex(d=>new RegExp('\\b'+d+'(-feira)?').test(s));if(w>=0){date=addD((w-new Date().getDay()+7)%7||7);s=s.replace(new RegExp('(n[oa]\\s+)?'+WD[w]+'(-feira)?','g'),' ')}}
 s.split(/\s*(?:,|;|\.|\be depois\b|\bdepois\b|\be também\b)\s*/).map(c=>c.trim()).filter(Boolean).forEach(c=>{
  const mo=c.match(/\b(gastei|paguei|recebi|ganhei)\s+(?:r\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais)?\s*(?:(?:com|em|de|no|na|nos|nas|para)\s+)?(.*)$/);
  if(mo){const d=cap(mo[3].trim()||'Sem descrição');return out.push({m:'fin',x:{type:/recebi|ganhei/.test(mo[1])?'receita':'despesa',description:d,amount:+mo[2].replace(',','.'),category:mo[1]=='recebi'||mo[1]=='ganhei'?'Salário':catOf(d.toLowerCase()),date}})}
  const tm=c.match(/(\d{1,2})(?:h(\d{2})?|:(\d{2}))(?![a-zà-ú])/)||c.match(/\bàs\s+(\d{1,2})\b/),hh=tm&&+tm[1]<24?pad(tm[1])+':'+(tm[2]||tm[3]||'00'):'';
  const body=tm?c.replace(tm[0],' ').replace(/\bàs\b/g,' '):c;
  if(/^(me )?lembr/.test(c)){const t=cln(body.replace(/^(me )?lembr\w*( de| que)?\s*/,''));if(t)out.push({m:'rem',x:{title:t,date,time:hh||'09:00',status:'pendente'}})}
  else if(hh){const t=cln(body,1);if(t)out.push({m:'agenda',x:{title:t,date,start:hh,end:'',location:''}})}
  else{const t=cln(body);if(t)out.push({m:'tasks',x:{title:t,description:'',priority:'média',status:'pendente',due:date}})}});
 return out}
const KL={tasks:'Tarefa',rem:'Lembrete',agenda:'Compromisso',fin:'Finanças'};
const pvSub=p=>({tasks:'prazo '+fdt(p.x.due),rem:fdt(p.x.date)+' às '+p.x.time,agenda:fdt(p.x.date)+' às '+p.x.start,fin:R(p.x.amount)+' de '+p.x.type}[p.m]);
const pvHtml=()=>`<div class="pv"><b>Vou criar:</b>${pend.map(p=>`<div class="pvr"><span class="tag">${KL[p.m]}</span><b>${esc(p.x.title||p.x.description)}</b> <span class="sub">${esc(pvSub(p))}</span></div>`).join('')}<div class="ac2"><button class="btn ghost sm" data-a="cancelpv">Cancelar</button><button class="btn sm" data-a="addpv">Adicionar tudo</button></div></div>`;

/* ---------- componentes ---------- */
const ck=(m,x)=>{const o=x.status==='concluída';return `<button class="ck ${o?'on':''}" data-a="tg" data-m="${m}" data-id="${x.id}" aria-label="${o?'Reabrir':'Concluir'}: ${esc(x.title)}">${o?'✓':''}</button>`};
const acts=(m,id)=>`<button class="btn ghost sm" data-a="ed" data-m="${m}" data-id="${id}">Editar</button><button class="btn ghost sm" data-a="rm" data-m="${m}" data-id="${id}">Excluir</button>`;
const row=(m,x,{c=1,sub='',late=0,right='',ac=1}={})=>`<div class="row ${x.status==='concluída'?'done':''}">${c?ck(m,x):''}<div class="tt"><b>${esc(x.title||x.description)}</b><div class="sub ${late?'late':''}">${sub}</div></div>${right}${ac?`<div class="ac">${acts(m,x.id)}</div>`:''}</div>`;
const hd=(t,m)=>`<div class="hd"><h1>${t}</h1><button class="btn" data-a="new" data-m="${m}">${F[m].g} ${F[m].n}</button></div>`;
const emp=t=>`<p class="mut">${t}</p>`;
const tSub=x=>(x.priority?`<span class="tag ${esc(x.priority)}">${esc(x.priority)}</span>`:'')+(x.due?'prazo '+fdt(x.due):'')+(x.description?' '+esc(x.description):'');
const rSub=r=>fdt(r.date)+' às '+esc(r.time||'');
const tl=a=>`<div class="tl"><b>${esc(a.start||'Dia todo')}</b> ${esc(a.title)}<div class="sub">${fdt(a.date)}${a.location?', '+esc(a.location):''}</div></div>`;
const fs=()=>{const p=TD().slice(0,7),l=D.fin.filter(x=>x.date.startsWith(p)),sm=t=>l.filter(x=>x.type===t).reduce((s,x)=>s+ +x.amount,0),cats={};l.filter(x=>x.type==='despesa').forEach(x=>cats[x.category]=(cats[x.category]||0)+ +x.amount);return{l:l.sort((a,b)=>a.date<b.date?1:-1),rec:sm('receita'),des:sm('despesa'),cats}};

/* ---------- telas ---------- */
function vAuth(){const r=mode==='reg';return `<div class="auth"><div class="card"><div class="logo">Painel da Vida</div><p>Tarefas, lembretes, agenda e finanças do seu dia em um só lugar.</p>
<div class="chips" style="margin:1.2rem 0 0"><button class="chip ${r?'':'on'}" data-a="mode" data-v="login">Entrar</button><button class="chip ${r?'on':''}" data-a="mode" data-v="reg">Criar conta</button></div>
<form id="fa">${r?'<label>Nome<input name="name" autocomplete="name" required></label>':''}<label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha (mínimo 6 caracteres)<input name="pw" type="password" minlength="6" autocomplete="${r?'new-password':'current-password'}" required></label><p id="err" class="err" role="alert"></p><button class="btn" style="width:100%">${r?'Criar conta':'Entrar'}</button></form>
<button class="btn ghost" data-a="demo" style="width:100%;margin-top:.7rem">Ver com dados de exemplo</button></div></div>`}

function vDash(){
 const t=TD(),pe=D.tasks.filter(x=>x.status==='pendente').sort(byDue),dn=D.tasks.length-pe.length,
 ag=D.agenda.filter(a=>a.date>=t).sort(byDT).slice(0,4),hoje=D.agenda.filter(a=>a.date===t).length,
 rm=D.rem.filter(r=>r.status==='pendente').sort(byDT).slice(0,3),f=fs(),
 gh=D.fin.filter(x=>x.type==='despesa'&&x.date===t).reduce((s,x)=>s+ +x.amount,0),
 h=new Date().getHours(),g=h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',u=user();
 return `<div class="top"><span class="logo">Painel da Vida</span><a class="av" href="#/perfil" aria-label="Perfil">${esc(u.name.charAt(0).toUpperCase())}</a></div>
<h1 class="hi">${g}, ${esc(u.name.split(' ')[0])}.</h1><p class="mut" style="margin:.3rem 0 0">${cap(new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))}</p>
<div class="qa"><form id="qa"><div class="qr"><input name="q" placeholder="Amanhã tenho médico às 14h e depois passo no mercado" aria-label="Escreva o que precisa organizar" autocomplete="off"><button class="btn sm">Interpretar</button></div><p class="sub">Escreva do seu jeito: separo em tarefa, compromisso, lembrete ou gasto. Usa regras simples, sem IA.</p></form><div id="pv"></div></div>
<p class="big">${pl(pe.length,'tarefa pendente','tarefas pendentes')} e ${pl(hoje,'compromisso','compromissos')} hoje.</p>
<p class="mut" style="margin:0 0 1.2rem">${R(gh)} gastos hoje, ${pl(rm.length,'lembrete próximo','lembretes próximos')}.</p>
<div class="grid"><section class="pn"><h3>Tarefas</h3>${pe.length?pe.slice(0,6).map(x=>row('tasks',x,{sub:tSub(x),ac:0})).join(''):emp('Nada pendente. Escreva acima ou crie uma tarefa.')}${dn?`<p class="sub">${pl(dn,'concluída','concluídas')}</p>`:''}<a href="#/tasks">Ver todas as tarefas</a></section>
<div class="col"><section class="pn"><h3>Próximos compromissos</h3>${ag.length?ag.map(tl).join(''):emp('Sem compromissos marcados.')}</section>
<section class="pn"><h3>Lembretes</h3>${rm.length?rm.map(r=>row('rem',r,{sub:rSub(r),ac:0})).join(''):emp('Nenhum lembrete pendente.')}</section>
<section class="pn"><h3>Finanças do mês</h3><div class="big" style="margin:0">${R(f.rec-f.des)}</div><p class="sub" style="margin:0">Receitas ${R(f.rec)}, despesas ${R(f.des)}</p><a href="#/fin">Ver finanças</a></section></div></div>`}

function vTasks(){
 let L=D.tasks.filter(x=>filt==='todas'||(filt==='pendentes'?x.status==='pendente':x.status==='concluída'));const po={alta:0,'média':1,baixa:2};
 L.sort(sortBy==='prioridade'?(a,b)=>po[a.priority]-po[b.priority]:byDue);
 return hd('Tarefas','tasks')+`<div class="chips">${['todas','pendentes','concluídas'].map(v=>`<button class="chip ${filt===v?'on':''}" data-a="filt" data-v="${v}">${cap(v)}</button>`).join('')}<select data-a="sort" aria-label="Ordenar"><option value="prazo" ${sortBy==='prazo'?'selected':''}>Ordenar por prazo</option><option value="prioridade" ${sortBy==='prioridade'?'selected':''}>Ordenar por prioridade</option></select></div><section class="pn">${L.length?L.map(x=>row('tasks',x,{sub:tSub(x),late:x.status==='pendente'&&x.due&&x.due<TD()})).join(''):emp('Nenhuma tarefa aqui. Toque em "Nova tarefa" para começar.')}</section>`}
function vRem(){const L=[...D.rem].sort(byDT),t=TD();return hd('Lembretes','rem')+`<section class="pn">${L.length?L.map(r=>row('rem',r,{sub:(r.status==='pendente'&&r.date<t?'atrasado, ':'')+rSub(r),late:r.status==='pendente'&&r.date<t})).join(''):emp('Nenhum lembrete. Crie um para não esquecer datas importantes.')}</section>`}
function vAgenda(){const L=[...D.agenda].sort(byDT),t=TD(),up=L.filter(a=>a.date>=t),pa=L.filter(a=>a.date<t);
 const it=a=>`<div class="row">${tl(a).replace('class="tl"','class="tl tt"')}<div class="ac">${acts('agenda',a.id)}</div></div>`;
 return hd('Agenda','agenda')+`<section class="pn"><h3>Próximos</h3>${up.length?up.map(it).join(''):emp('Sem compromissos futuros.')}</section>${pa.length?`<section class="pn"><h3>Anteriores</h3>${pa.reverse().map(it).join('')}</section>`:''}`}
function vFin(){const f=fs(),cs=Object.entries(f.cats).sort((a,b)=>b[1]-a[1]),mx=cs[0]?cs[0][1]:1;
 return hd('Finanças','fin')+`<div class="sums"><div><span class="sub">Receitas</span><b>${R(f.rec)}</b></div><div><span class="sub">Despesas</span><b>${R(f.des)}</b></div><div><span class="sub">Saldo</span><b>${R(f.rec-f.des)}</b></div></div>
<section class="pn"><h3>Gastos do mês por categoria</h3>${cs.length?cs.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="bw"><div class="bar" style="width:${v/mx*100}%"></div></div><b>${R(v)}</b></div>`).join(''):emp('Nenhuma despesa neste mês.')}</section>
<section class="pn"><h3>Movimentações</h3>${f.l.length?f.l.map(x=>row('fin',x,{c:0,sub:fdt(x.date)+', '+esc(x.category),right:`<b>${x.type==='despesa'?'-':'+'}${R(x.amount)}</b>`})).join(''):emp('Sem movimentações neste mês.')}</section>`}
function vPerfil(){const u=user();return `<div class="hd"><h1>Perfil</h1></div>
<section class="pn"><h3>Seus dados</h3><form id="fp"><label>Nome<input name="name" value="${esc(u.name)}" required></label><label>E-mail<input value="${esc(u.email)}" disabled></label><button class="btn" style="margin-top:1rem">Salvar nome</button></form></section>
<section class="pn"><h3>Alterar senha</h3><form id="fw"><label>Senha atual<input name="a" type="password" required></label><label>Nova senha<input name="b" type="password" minlength="6" required></label><p id="err" class="err" role="alert"></p><button class="btn">Alterar senha</button></form></section>
${subSec(u)}<p class="sub">Nesta demonstração os dados ficam só neste navegador e cada conta enxerga apenas os próprios registros.</p><button class="btn ghost" data-a="logout">Sair da conta</button>`}

const NAV=[['dash','Hoje'],['tasks','Tarefas'],['rem','Lembretes'],['agenda','Agenda'],['fin','Finanças']];
function render(){
 const app=$('#app');if(!user()){app.innerHTML=vAuth();return}
 if(!D)load();
 if(!active(user())){app.innerHTML=vPay();return}
 const l=NAV.map(([k,n])=>`<a href="#/${k}" class="${view===k?'on':''}" ${view===k?'aria-current="page"':''}>${n}</a>`).join('');
 app.innerHTML=`<div class="wrap"><aside class="side"><div class="logo">Painel da Vida</div>${l}<a href="#/perfil" class="${view==='perfil'?'on':''}" style="margin-top:auto">Perfil</a></aside><main>${{dash:vDash,tasks:vTasks,rem:vRem,agenda:vAgenda,fin:vFin,perfil:vPerfil}[view]()}</main><nav class="bot" aria-label="Principal">${l}</nav></div>`}
const go=()=>{const v=location.hash.replace('#/','');view=['tasks','rem','agenda','fin','perfil'].includes(v)?v:'dash';render();scrollTo(0,0)};
addEventListener('hashchange',go);

function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?'<button data-a="undo">Desfazer</button>':'');t.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>t.hidden=true,5000)}
function openForm(m,id){const c=F[m],it=id?D[m].find(x=>x.id===id):{...c.d},dl=$('#dlg');dl.dataset.m=m;dl.dataset.id=id||'';
 const fld=c.f.map(([k,l,t,r])=>{const v=it[k]??((t==='date'&&r)?TD():'');return `<label>${l}${Array.isArray(t)?`<select name="${k}">${t.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" value="${esc(v)}" ${r?'required':''} ${t==='number'?'step="0.01" min="0.01"':''}>`}</label>`}).join('');
 dl.innerHTML=`<form id="fm"><h2>${id?'Editar':c.g} ${c.n}</h2>${fld}<div class="ac2"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn">Salvar</button></div></form>`;dl.showModal()}
function enter(id){me=id;st.s('pv:s',id);mySid=uid();st.s('pv:sid:'+id,mySid);D=null;view='dash';location.hash='#/dash';render()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const{a,m,id,v}=b.dataset;
 if(a==='tg'){const x=D[m].find(i=>i.id===id);x.status=x.status==='pendente'?'concluída':'pendente';x.updated_at=Date.now();save();render()}
 else if(a==='new')openForm(m);else if(a==='ed')openForm(m,id);else if(a==='close')$('#dlg').close();
 else if(a==='rm'){const i=D[m].findIndex(x=>x.id===id);last={m,x:D[m][i],i};D[m].splice(i,1);save();render();toast(cap(F[m].n)+' excluído(a).',1)}
 else if(a==='undo'&&last){D[last.m].splice(last.i,0,last.x);last=null;save();render();$('#toast').hidden=true}
 else if(a==='filt'){filt=v;render()}
 else if(a==='mode'){mode=v;render()}
 else if(a==='demo'){let u=users.find(x=>x.email==='demo@painel.app');if(!u){u={id:uid(),name:'Visitante',email:'demo@painel.app',hash:'-',created_at:Date.now()};users.push(u);saveU();me=u.id;D=seed();save()}enter(u.id)}
 else if(a==='logout'){me=null;D=null;st.s('pv:s','');render()}
 else if(a==='pay')openPay(v);
 else if(a==='paid'){const u=user();u.sub={method:v,until:Date.now()+30*DAY,renew:true};saveU();$('#dlg').close();render();toast('Assinatura ativada. Bem-vindo!')}
 else if(a==='renew'){const b=user().sub;b.renew=!b.renew;saveU();render();toast(b.renew?'Renovação reativada.':'Renovação cancelada. O acesso segue até o fim do período.')}
 else if(a==='cancelpv'){pend=[];$('#pv').innerHTML=''}
 else if(a==='addpv'){pend.forEach(p=>D[p.m].push({id:uid(),created_at:Date.now(),updated_at:Date.now(),...p.x}));const n=pend.length;pend=[];save();render();toast(pl(n,'item adicionado.','itens adicionados.'))}});
document.addEventListener('change',e=>{if(e.target.dataset.a==='sort'){sortBy=e.target.value;render()}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id=e.target.id,err=$('#err');
 if(id==='fa'){const em=f.email.trim().toLowerCase();
  if(mode==='reg'){if(users.some(u=>u.email===em)){err.textContent='Este e-mail já tem cadastro. Entre com sua senha.';return}
   const u={id:uid(),name:f.name.trim(),email:em,hash:await sha(em+':'+f.pw),created_at:Date.now()};users.push(u);saveU();me=u.id;D={tasks:[],rem:[],agenda:[],fin:[]};save();enter(u.id)}
  else{const u=users.find(x=>x.email===em);if(!u||u.hash!==await sha(em+':'+f.pw)){err.textContent='E-mail ou senha incorretos. Confira e tente de novo.';return}enter(u.id)}}
 else if(id==='qa'){pend=parse(f.q||'');if(!pend.length){$('#pv').innerHTML='<p class="sub" style="margin-top:.6rem">Não entendi. Tente: "amanhã médico às 14h e depois mercado" ou "gastei 45 no almoço".</p>';return}$('#pv').innerHTML=pvHtml()}
 else if(id==='fm'){const dl=$('#dlg'),m=dl.dataset.m,i=dl.dataset.id;if(f.amount)f.amount=+f.amount;
  if(i)Object.assign(D[m].find(x=>x.id===i),f,{updated_at:Date.now()});else D[m].push({id:uid(),...F[m].d,...f,created_at:Date.now(),updated_at:Date.now()});
  save();dl.close();render();toast('Salvo.')}
 else if(id==='fp'){user().name=f.name.trim();saveU();render();toast('Nome atualizado.')}
 else if(id==='fw'){const u=user();if(u.hash!==await sha(u.email+':'+f.a)){err.textContent='A senha atual está incorreta.';return}u.hash=await sha(u.email+':'+f.b);saveU();e.target.reset();err.textContent='';toast('Senha alterada.')}});
addEventListener('storage',e=>{if(me&&e.key==='pv:sid:'+me&&e.newValue!==mySid){me=null;D=null;render();toast('Sua conta foi aberta em outro dispositivo. Só uma sessão por vez é permitida.')}});
if(me)mySid=st.g('pv:sid:'+me);
go();
</script></body></html>
